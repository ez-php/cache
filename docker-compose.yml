services:

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        WWWUSER: 1000
        WWWGROUP: 1000
    container_name: ez-php-cache-app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      memcached:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: ez-php-cache-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  # Reached as memcached:11211 over the Compose network only — no host port published.
  memcached:
    image: memcached:1.6-alpine
    container_name: ez-php-cache-memcached
